<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>J.A.R.V.I.S. — Cheers mate タスク</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="17" class="mark-o"/><circle cx="20" cy="20" r="10" class="mark-m"/><circle cx="20" cy="20" r="4.5" class="mark-c"/>
  </svg>
  <div class="brand">J.A.R.V.I.S.</div>
  <span class="pill" id="sysPill"><i></i><span>起動中</span></span>
  <button class="icon-btn" id="btnRefresh" aria-label="最新のデータを読み込む">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
  </button>
</header>

<main id="app" hidden>
  <!-- 稼働状況：リアクター＋4つの状態 -->
  <section class="hero" aria-labelledby="hStatus">
    <h2 id="hStatus" class="sr">稼働状況</h2>
    <div class="core">
      <svg id="reactor" class="reactor" viewBox="0 0 240 240" role="img" aria-labelledby="coreLabel"></svg>
      <div class="core-center">
        <div class="core-num" id="coreNum">0</div>
        <div class="core-label">判断待ち</div>
      </div>
    </div>
    <p class="core-sub" id="coreSub"></p>
    <div class="stats" id="stats"></div>
  </section>

  <section class="sec sec-primary" id="panelCall" aria-labelledby="hCall">
    <h2 class="sec-h" id="hCall">要対応<span class="sec-n" id="callN"></span></h2>
    <p class="sec-d">ゆうすけさんの判断で止まっているもの（重要・期限の近い順）</p>
    <div id="callList"></div>
  </section>

  <section class="sec" id="panelToday" aria-labelledby="hToday">
    <h2 class="sec-h" id="hToday">今日のタスク<span class="sec-n" id="todayN"></span></h2>
    <div id="todayList"></div>
  </section>

  <section class="sec" id="panelTasks" aria-labelledby="hAll">
    <h2 class="sec-h" id="hAll">全タスク</h2>
    <div class="filters" id="filters" role="tablist"></div>
    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="検索（タスク・担当・プロジェクト）" enterkeyhint="search" aria-label="タスクを検索"></label>
      <button class="toggle" id="onlyHigh" aria-pressed="false">重要だけ</button>
    </div>
    <div id="taskCount" class="count"></div>
    <div id="taskList"></div>
  </section>

  <footer class="foot">
    <div id="syncInfo"></div>
    <a id="boardLink" target="_blank" rel="noopener">Notionの統合タスクボード（正本）を開く</a>
    <button class="linkish" id="btnLock">この端末から鍵を消す</button>
  </footer>
</main>

<section id="lock" class="lock" hidden>
  <svg class="lock-mark" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="17" class="mark-o"/><circle cx="20" cy="20" r="10" class="mark-m"/><circle cx="20" cy="20" r="4.5" class="mark-c"/>
  </svg>
  <h2>パスフレーズを入力</h2>
  <p>この端末で最初の1回だけ必要です</p>
  <form id="lockForm">
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="パスフレーズ" aria-label="パスフレーズ">
    <button type="submit">開く</button>
  </form>
  <p class="err" id="lockErr" role="alert"></p>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
